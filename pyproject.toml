[project]
name = "cloudbees-agent"
version = "0.1.0"
description = "Small GitHub evidence agent for the CloudBees assessment"
readme = "SPECS.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "logfire>=4.16.0",
    "pydantic>=2.12.0",
    "pydantic-ai>=1.31.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
cloudbees-agent = "cloudbees_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "smoke: manually triggered tests that call real external services and require local credentials",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudbees_agent"]
